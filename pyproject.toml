[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetai"
version = "0.1.0"
description = "Live Armenian transcription and English translation, fully local"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "faster-whisper>=1.0.3",
    "ctranslate2>=4.3",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "silero-vad>=5.1",
    "speechbrain>=1.0",
    "torch>=2.2",
    "torchaudio>=2.2",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
meetai = "meetai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
